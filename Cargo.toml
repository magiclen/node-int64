[package]
name = "int64-napi"
version = "5.0.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/magiclen/node-int64"
homepage = "https://magiclen.org/node-js-int64/"
keywords = ["nodejs", "int64", "long"]
categories = []
description = "Use Rust to compute 64-bit signed integers."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
napi = "3.12.4"
napi-derive = "3.6.5"

random-number = "0.1.10"

[build-dependencies]
napi-build = "2.4.2"
